[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "cas-hosting-adapter"
version = "0.1.0"
description = "Claude Agent SDK adapter for Gemini Enterprise Agent Platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "claude-agent-sdk==0.2.128",
  "fastapi==0.141.1",
  "google-auth==2.47.0",
  "google-cloud-aiplatform==1.163.0",
  "google-cloud-storage==2.19.0",
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
  "uvicorn[standard]==0.41.0",
]

[dependency-groups]
dev = [
  "httpx2==2.7.0",
  "mypy==1.19.1",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "ruff==0.15.5",
]

[tool.setuptools.packages.find]
include = ["cas_hosting_adapter*", "example*", "sample_frontend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "live_gcp: 明示的な環境変数を指定した場合のみ実行する Google Cloud 統合テスト",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["cas_hosting_adapter"]
